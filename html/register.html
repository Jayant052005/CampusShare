<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account - CampusShare</title>
  <meta name="description" content="Join CampusShare with your university .edu student email to buy, sell, borrow, and exchange items safely on campus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="auth-page-container">
    <div class="auth-card-v2" style="max-width: 520px;">

      <div class="auth-header-center">
        <div class="auth-badge-logo">C</div>
        <h1 style="color: var(--navy); font-size: 1.75rem; margin-bottom: 6px; font-weight: 800;">Create Account</h1>
        <p style="color: var(--secondary-text); font-size: 0.95rem; margin: 0;">Connect with verified students at your campus</p>
      </div>

      <!-- Google option -->
      <button type="button" id="google-register-btn" class="auth-google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.71-1.57 2.68-3.88 2.68-6.61z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.7a5.41 5.41 0 0 1 0-3.4V4.97H.96a9 9 0 0 0 0 8.06l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.47C13.46.99 11.42 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33c.71-2.13 2.69-3.72 5.03-3.72z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">or register with university details</div>

      <form id="register-form">
        <!-- Full Name -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-name">Full Name *</label>
          <input
            type="text"
            id="reg-name"
            class="input-field"
            placeholder="Jordan Taylor"
            required
            autocomplete="name"
          />
        </div>

        <!-- University Email -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-email">Email *</label>
          <input
            type="email"
            id="reg-email"
            class="input-field"
            placeholder="student@stanford.edu"
            required
            autocomplete="email"
          />
          <div class="form-hint" style="font-size: 0.775rem; color: var(--secondary-text); margin-top: 4px;">
            Must end with .edu for instant campus peer verification
          </div>
        </div>

        <!-- College / University -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-university">College/University *</label>
          <select id="reg-university" class="select-field" required>
            <option value="Stanford University" selected>Stanford University</option>
            <option value="UC Berkeley">UC Berkeley</option>
            <option value="MIT">MIT</option>
            <option value="Harvard University">Harvard University</option>
            <option value="UT Austin">UT Austin</option>
            <option value="University of Michigan">University of Michigan</option>
            <option value="NYU">NYU</option>
            <option value="UCLA">UCLA</option>
          </select>
        </div>

        <!-- Passwords -->
        <div class="grid-2 mb-lg">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input
              type="password"
              id="reg-password"
              class="input-field"
              placeholder="••••••••"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
            <input
              type="password"
              id="reg-confirm-password"
              class="input-field"
              placeholder="••••••••"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Button: Create Account -->
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="font-size: 1rem; font-weight: 700; padding: 13px;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--secondary-text);">
        Already have an account?
        <a href="login.html" style="color: var(--blue); font-weight: 700; text-decoration: none; margin-left: 4px;">
          Log In
        </a>
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
