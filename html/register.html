<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Student Account - CampusShare</title>
  <meta name="description" content="Create a verified student account on CampusShare using your university .edu email.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="auth-page-main">
    <div class="card register-card">

      <div class="text-center mb-xl">
        <div class="brand-icon brand-icon-lg">C</div>
        <h2 class="text-navy mb-xs">Join CampusShare</h2>
        <p class="text-muted">Connect with verified students at your university</p>
      </div>

      <form id="register-form">

        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="input-field" placeholder="Jordan Taylor" required>
        </div>

        <div class="form-group">
          <label class="form-label">University Email (.edu) *</label>
          <input type="email" id="reg-email" class="input-field" placeholder="student@stanford.edu" required>
          <div class="form-hint">Must end in .edu for campus student verification</div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">University *</label>
            <select id="reg-university" class="select-field" required>
              <option value="Stanford University">Stanford University</option>
              <option value="UC Berkeley">UC Berkeley</option>
              <option value="MIT">MIT</option>
              <option value="Harvard University">Harvard University</option>
              <option value="UT Austin">UT Austin</option>
              <option value="University of Michigan">University of Michigan</option>
              <option value="NYU">NYU</option>
              <option value="UCLA">UCLA</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Major &amp; Class Year</label>
            <input type="text" id="reg-major" class="input-field" placeholder="e.g. Computer Science '26">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="reg-password" class="input-field" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-md">Create Verified Account</button>
      </form>

      <div class="auth-footer-note">
        Already have an account? <a href="login.html">Log In</a>
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
