<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details — CampusShare</title>
  <meta name="description"
    content="View verified campus listing details, photo gallery, student seller verification, and secure campus pickup location.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/homepage.css">
  <link rel="stylesheet" href="../css/marketplace.css">
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL NAVBAR (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <header id="navbar" class="site-header"></header>

  <main>
    <div class="container py-xl">
      <!-- Container populated dynamically by item-details.js -->
      <div id="item-details-container">
        <div class="id-loading-state">
          <div class="id-loading-icon">⏳</div>
          <p class="id-loading-text">Loading campus listing details...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════════
       CONTACT SELLER MODAL
  ══════════════════════════════════════════════════════════ -->
  <div id="id-contact-modal" class="modal-overlay">
    <div class="modal-card modal-card-md">
      <button type="button" onclick="closeContactModal()" class="modal-close-btn">✕</button>
      <div class="modal-seller-header">
        <div id="modal-seller-avatar-wrap" class="modal-seller-avatar">
          <span id="modal-seller-initials">AR</span>
        </div>
        <div>
          <h3 id="modal-seller-title" class="modal-seller-name">Message Seller</h3>
          <span id="modal-item-title" class="modal-item-subtitle"></span>
        </div>
      </div>

      <!-- Quick Message Chips -->
      <div class="modal-quick-chips-wrap">
        <span class="modal-quick-chips-label">Quick Message Suggestions</span>
        <div class="modal-quick-chips-list">
          <button type="button" class="btn btn-outline btn-sm text-left"
            onclick="fillQuickMessage('Hi! Is this still available for campus pickup?')">"Hi! Is this still available
            for campus pickup?"</button>
          <button type="button" class="btn btn-outline btn-sm text-left"
            onclick="fillQuickMessage('Hello, would you be open to meeting at the library tomorrow?')">"Hello, would you
            be open to meeting at the library tomorrow?"</button>
          <button type="button" class="btn btn-outline btn-sm text-left" id="modal-custom-type-chip"
            onclick="fillQuickMessage('I am very interested in this listing!')">"I am very interested in this
            listing!"</button>
        </div>
      </div>

      <form id="contact-seller-form">
        <div class="form-group mb-md">
          <label class="form-label">Your Message</label>
          <textarea id="modal-message-input" class="textarea-field modal-message-textarea"
            placeholder="Write a note to arrange pickup, ask questions, or propose terms..." required></textarea>
        </div>
        <div class="modal-actions-row">
          <button type="button" class="btn btn-outline" onclick="closeContactModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Send Message 🚀</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       REPORT LISTING MODAL
  ══════════════════════════════════════════════════════════ -->
  <div id="id-report-modal" class="modal-overlay">
    <div class="modal-card modal-card-sm">
      <button type="button" onclick="closeReportModal()" class="modal-close-btn">✕</button>
      <div class="modal-icon-header">🛡️</div>
      <h3 class="modal-title">Report this Campus Listing</h3>
      <p class="modal-desc">
        Help keep our student community safe and trusted. What seems wrong with this listing?
      </p>

      <form id="report-form" onsubmit="submitReport(event)">
        <div class="form-group mb-sm">
          <label class="modal-radio-label"><input
              type="radio" name="reportReason" value="inappropriate" required> Inappropriate or non-student
            content</label>
          <label class="modal-radio-label"><input
              type="radio" name="reportReason" value="spam"> Suspected spam or scam</label>
          <label class="modal-radio-label"><input
              type="radio" name="reportReason" value="pricing"> Unfair or misleading pricing</label>
          <label class="modal-radio-label"><input
              type="radio" name="reportReason" value="duplicate"> Duplicate or already sold</label>
        </div>
        <div class="modal-actions-row modal-actions-row-spaced">
          <button type="button" class="btn btn-outline" onclick="closeReportModal()">Cancel</button>
          <button type="submit" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL FOOTER (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/item-details.js"></script>
</body>

</html>
