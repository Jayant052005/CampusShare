<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Details — CampusShare</title>
  <meta name="description" content="View verified campus listing details, photo gallery, student seller verification, and secure campus pickup location.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/homepage.css">
  <link rel="stylesheet" href="../css/marketplace.css">
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL NAVBAR (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <header id="navbar" class="site-header"></header>

  <main>
    <div class="container py-xl">
      <!-- Container populated dynamically by item-details.js -->
      <div id="item-details-container">
        <div style="text-align: center; padding: 64px 0;">
          <div style="font-size: 2.5rem; margin-bottom: 12px;">⏳</div>
          <p style="color: var(--secondary-text);">Loading campus listing details...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════════
       CONTACT SELLER MODAL
  ══════════════════════════════════════════════════════════ -->
  <div id="id-contact-modal" class="modal-overlay" style="display:none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 24, 46, 0.6); backdrop-filter: blur(4px); z-index: 2100; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 20px; width: 92%; max-width: 520px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; animation: modalPop 0.25s ease;">
      <button type="button" onclick="closeContactModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.3rem; color: #9CA3AF; cursor: pointer;">✕</button>
      
      <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 20px;">
        <div id="modal-seller-avatar-wrap" style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--navy), var(--blue)); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0;">
          <span id="modal-seller-initials">AR</span>
        </div>
        <div>
          <h3 id="modal-seller-title" style="font-size: 1.15rem; color: var(--navy); margin-bottom: 2px;">Message Seller</h3>
          <span id="modal-item-title" style="font-size: 0.85rem; color: var(--secondary-text);"></span>
        </div>
      </div>

      <!-- Quick Message Chips -->
      <div style="margin-bottom: 16px;">
        <span style="font-size: 0.78rem; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Quick Message Suggestions</span>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button type="button" class="btn btn-outline btn-sm text-left" onclick="fillQuickMessage('Hi! Is this still available for campus pickup?')">"Hi! Is this still available for campus pickup?"</button>
          <button type="button" class="btn btn-outline btn-sm text-left" onclick="fillQuickMessage('Hello, would you be open to meeting at the library tomorrow?')">"Hello, would you be open to meeting at the library tomorrow?"</button>
          <button type="button" class="btn btn-outline btn-sm text-left" id="modal-custom-type-chip" onclick="fillQuickMessage('I am very interested in this listing!')">"I am very interested in this listing!"</button>
        </div>
      </div>

      <form id="contact-seller-form">
        <div class="form-group mb-md">
          <label class="form-label">Your Message</label>
          <textarea id="modal-message-input" class="textarea-field" style="min-height: 100px;" placeholder="Write a note to arrange pickup, ask questions, or propose terms..." required></textarea>
        </div>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-outline" onclick="closeContactModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Send Message 🚀</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       REPORT LISTING MODAL
  ══════════════════════════════════════════════════════════ -->
  <div id="id-report-modal" class="modal-overlay" style="display:none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 24, 46, 0.6); backdrop-filter: blur(4px); z-index: 2100; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 20px; width: 92%; max-width: 480px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative;">
      <button type="button" onclick="closeReportModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 1.3rem; color: #9CA3AF; cursor: pointer;">✕</button>
      
      <div style="font-size: 2rem; margin-bottom: 8px;">🛡️</div>
      <h3 style="font-size: 1.25rem; color: var(--navy); margin-bottom: 6px;">Report this Campus Listing</h3>
      <p style="font-size: 0.875rem; color: var(--secondary-text); margin-bottom: 18px;">
        Help keep our student community safe and trusted. What seems wrong with this listing?
      </p>

      <form id="report-form" onsubmit="submitReport(event)">
        <div class="form-group mb-sm">
          <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--navy);"><input type="radio" name="reportReason" value="inappropriate" required /> Inappropriate or non-student content</label>
          <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--navy);"><input type="radio" name="reportReason" value="spam" /> Suspected spam or scam</label>
          <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--navy);"><input type="radio" name="reportReason" value="pricing" /> Unfair or misleading pricing</label>
          <label style="display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--navy);"><input type="radio" name="reportReason" value="duplicate" /> Duplicate or already sold</label>
        </div>
        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
          <button type="button" class="btn btn-outline" onclick="closeReportModal()">Cancel</button>
          <button type="submit" class="btn btn-danger">Submit Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL FOOTER (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/item-details.js"></script>
</body>
</html>
