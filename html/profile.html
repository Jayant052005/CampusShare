<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - CampusShare</title>
  <meta name="description" content="View your verified student profile, active campus marketplace listings, saved items, and campus reputation score.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="section-sm pb-3xl">
    <div class="container">

      <!-- Profile Container Card -->
      <div class="profile-main-card">
        <div class="profile-cover-banner"></div>

        <div class="profile-header-content" id="profile-header-content">
          <!-- Injected dynamically by profile.js -->
        </div>
      </div>

      <!-- Profile 4-Tabs Navigation Bar -->
      <div class="cs-tabs-nav" id="profile-tabs-nav" role="tablist">
        <button type="button" class="cs-tab-btn active" data-tab="listings" role="tab" aria-selected="true">
          My Listings (<span id="profile-tab-listings-count">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-tab="saved" role="tab" aria-selected="false">
          Saved (<span id="profile-tab-saved-count">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-tab="transactions" role="tab" aria-selected="false">
          Transactions (<span id="profile-tab-transactions-count">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-tab="reviews" role="tab" aria-selected="false">
          Reviews (<span id="profile-tab-reviews-count">0</span>)
        </button>
      </div>

      <!-- Tab Content Area -->
      <div id="profile-tab-content" class="profile-tab-content-wrap">
        <!-- Injected dynamically by profile.js -->
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
