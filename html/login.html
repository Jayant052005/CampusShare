<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - CampusShare</title>
  <meta name="description" content="Log in to CampusShare with your university .edu email address.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="site-header" class="site-header"></header>

  <main class="auth-page-main">
    <div class="card auth-card">

      <div class="text-center mb-xl">
        <div class="brand-icon brand-icon-lg">C</div>
        <h2 class="text-navy mb-xs">Welcome Back</h2>
        <p class="text-muted">Sign in with your university student email</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Campus Email Address (.edu)</label>
          <input type="email" id="login-email" class="input-field" placeholder="student@university.edu" required>
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center mb-xs">
            <label class="form-label mb-0">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-md">Sign In to CampusShare</button>
      </form>

      <div class="auth-footer-note">
        Don't have a CampusShare account? <a href="register.html">Register Here</a>
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
