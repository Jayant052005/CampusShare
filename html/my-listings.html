<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Campus Listings - CampusShare</title>
  <meta name="description" content="Seller and student lender dashboard to manage listings, track views, mark items as sold, or pause listings.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="section-sm pb-3xl">
    <div class="container">

      <!-- Header Section -->
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="color: var(--navy); font-size: 2rem; font-weight: 800; margin-bottom: 6px;">
            My Campus Listings
          </h1>
          <p style="color: var(--secondary-text); font-size: 1rem; margin: 0;">
            Track views, update prices, or mark items as sold to campus peers
          </p>
        </div>
        <a href="post-item.html" class="btn btn-primary" style="padding: 12px 22px; font-weight: 700; border-radius: 12px;">
          + Post New Item
        </a>
      </div>

      <!-- 5 Status Tabs per prompt: Active, Pending, Sold, Donated, Lent -->
      <div class="cs-tabs-nav" id="listings-status-tabs" role="tablist">
        <button type="button" class="cs-tab-btn active" data-status="active" role="tab" aria-selected="true">
          Active (<span id="status-count-active">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-status="pending" role="tab" aria-selected="false">
          Pending (<span id="status-count-pending">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-status="sold" role="tab" aria-selected="false">
          Sold (<span id="status-count-sold">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-status="donated" role="tab" aria-selected="false">
          Donated (<span id="status-count-donated">0</span>)
        </button>
        <button type="button" class="cs-tab-btn" data-status="lent" role="tab" aria-selected="false">
          Lent (<span id="status-count-lent">0</span>)
        </button>
      </div>

      <!-- Listings List Container -->
      <div id="my-listings-container">
        <!-- Injected dynamically by profile.js -->
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
