<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Messages &amp; Peer Chat - CampusShare</title>
  <meta name="description"
    content="Chat securely with verified student buyers and sellers on campus to negotiate prices, ask questions, and propose safe campus meetups.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <!-- Supabase Route Guard -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from "../src/supabaseClient.js";

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      const user = session.user;
      const current = typeof getCurrentUser === "function" ? getCurrentUser() : null;
      if (!current || current.id !== user.id) {
        if (typeof setCurrentUser === "function") {
          setCurrentUser({
            id: user.id,
            name: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split("@")[0],
            email: user.email,
            avatar: user.user_metadata?.avatar_url || null,
            university: user.user_metadata?.university || "Campus Member"
          });
          if (typeof initNavbar === "function") initNavbar();
        }
      }
    }
  </script>
</head>

<body>

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="cs-msg-page">
    <div class="container">
      <div id="cs-msg-container" class="cs-msg-container">

        <!-- LEFT COLUMN: Conversation Directory -->
        <aside class="cs-msg-sidebar" id="cs-msg-sidebar">
          <div class="cs-msg-sidebar-header">
            <div class="cs-msg-sidebar-title-row">
              <h2 class="cs-msg-sidebar-title">
                Campus Messages
                <span id="cs-msg-unread-pill" class="cs-msg-unread-pill">0 new</span>
              </h2>
            </div>
            <div class="cs-msg-search-wrap">
              <span class="cs-msg-search-icon">🔍</span>
              <input type="text" id="cs-msg-search" class="cs-msg-search-input" placeholder="Search conversations..."
                autocomplete="off">
            </div>
          </div>

          <!-- Scrollable Conversations List -->
          <div id="cs-conv-list" class="cs-conv-list" role="tablist" aria-label="Campus Conversations">
            <!-- Injected by messages.js -->
          </div>
        </aside>

        <!-- RIGHT COLUMN: Interactive Chat Room -->
        <section class="cs-msg-chat" id="cs-chat-pane" aria-label="Conversation Thread">
          <!-- Injected by messages.js -->
        </section>

      </div>
    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/messages.js"></script>
</body>

</html>
