<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account - CampusShare</title>
  <meta name="description"
    content="Join CampusShare with your university email to buy, sell, borrow, and exchange items safely on campus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/marketplace.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="bg-background">

  <!-- Dynamic Global Site Header -->
  <header id="navbar" class="site-header"></header>

  <main class="auth-page-container">
    <div class="auth-card-v2 auth-card-wide">

      <div class="auth-header-center">
        <div class="auth-badge-logo">C</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Connect with verified students at your campus</p>
      </div>

      <!-- Google option -->
      <button type="button" id="google-register-btn" class="auth-google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.71-1.57 2.68-3.88 2.68-6.61z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z" />
          <path fill="#FBBC05" d="M3.97 10.7a5.41 5.41 0 0 1 0-3.4V4.97H.96a9 9 0 0 0 0 8.06l3.01-2.33z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.47C13.46.99 11.42 0 9 0 5.48 0 2.44 2.02.96 4.97l3.01 2.33c.71-2.13 2.69-3.72 5.03-3.72z" />
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">or register with email</div>

      <form id="register-form">
        <!-- Full Name -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-name">Full Name *</label>
          <input type="text" id="reg-name" class="input-field" placeholder="Jordan Taylor" required autocomplete="name">
        </div>

        <!-- Primary Email (required for login) -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-email">Email *</label>
          <input type="email" id="reg-email" class="input-field" placeholder="you@gmail.com" required
            autocomplete="email">
        </div>

        <!-- University Email (optional) -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-uni-email">University Email</label>
          <input type="email" id="reg-uni-email" class="input-field" placeholder="student@university.edu"
            autocomplete="email">
          <div class="form-hint auth-form-hint">
            Optional — add your university email for campus verification
          </div>
        </div>

        <!-- College / University -->
        <div class="form-group mb-md">
          <label class="form-label" for="reg-university">College/University *</label>
          <input type="text" id="reg-university" class="input-field" placeholder="e.g. Stanford University" required
            autocomplete="organization">
        </div>

        <!-- Passwords -->
        <div class="grid-2 mb-lg">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="input-field" placeholder="••••••••" required minlength="6"
              autocomplete="new-password">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
            <input type="password" id="reg-confirm-password" class="input-field" placeholder="••••••••" required
              minlength="6" autocomplete="new-password">
          </div>
        </div>

        <!-- Button: Create Account -->
        <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit-btn">
          Create Account
        </button>
      </form>

      <!-- Supabase Auth Error Message -->
      <div id="auth-error-msg" class="auth-error-msg"></div>

      <div class="auth-footer-text">
        Already have an account?
        <a href="login.html" class="auth-switch-link">
          Log In
        </a>
      </div>

    </div>
  </main>

  <!-- Dynamic Global Site Footer -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from "../src/supabaseClient.js";

    const registerForm = document.getElementById("register-form");
    const errorMsg = document.getElementById("auth-error-msg");

    // ── Google OAuth ──
    const googleBtn = document.getElementById("google-register-btn");
    if (googleBtn) {
      googleBtn.addEventListener("click", async () => {
        try {
          if (errorMsg) {
            errorMsg.textContent = "";
            errorMsg.style.display = "none";
          }
          const redirectUrl = window.location.origin.startsWith("http")
            ? window.location.origin
            : "http://localhost:3000";

          const { data, error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: redirectUrl
            }
          });

          if (error) {
            if (errorMsg) {
              errorMsg.style.color = "var(--danger, #EF4444)";
              errorMsg.textContent = error.message;
              errorMsg.style.display = "block";
            }
            return;
          }

          if (data?.url) {
            window.location.href = data.url;
          }
        } catch (err) {
          console.error("Google OAuth error:", err);
          if (errorMsg) {
            errorMsg.style.color = "var(--danger, #EF4444)";
            errorMsg.textContent = err.message || "Failed to start Google sign in.";
            errorMsg.style.display = "block";
          }
        }
      });
    }

    // ── Email / Password Registration ──
    if (registerForm) {
      registerForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        if (errorMsg) {
          errorMsg.textContent = "";
          errorMsg.style.display = "none";
        }

        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const confirmPassword = document.getElementById("reg-confirm-password").value;

        if (password !== confirmPassword) {
          if (errorMsg) {
            errorMsg.textContent = "Passwords do not match. Please verify both passwords.";
            errorMsg.style.display = "block";
          }
          return;
        }

        const fullName = document.getElementById("reg-name")?.value.trim() || "";
        const university = document.getElementById("reg-university")?.value.trim() || "";
        const uniEmail = document.getElementById("reg-uni-email")?.value.trim() || "";

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              university: university,
              university_email: uniEmail
            }
          }
        });

        if (error) {
          if (errorMsg) {
            errorMsg.style.color = "var(--danger, #EF4444)";
            errorMsg.textContent = error.message;
            errorMsg.style.display = "block";
          }
          return;
        }

        // After signUp(), if data.session is null, don't redirect to the dashboard.
        // Just show: "Check your email and confirm your account before logging in."
        if (!data?.session) {
          if (errorMsg) {
            errorMsg.style.color = "var(--blue, #1769FF)";
            errorMsg.textContent = "Check your email and confirm your account before logging in.";
            errorMsg.style.display = "block";
          }
          return;
        }

        // Only redirect when a real session exists
        if (typeof setCurrentUser === "function") {
          setCurrentUser({
            id: data.session.user.id,
            name: fullName || email.split("@")[0],
            email: email,
            university: university || "Campus Member"
          });
        }
        window.location.href = "../index.html";
      });
    }
  </script>
</body>

</html>
