<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Saved Wishlist — CampusShare</title>
  <meta name="description"
    content="Keep track of saved textbooks, electronics, notes, and dorm gear you want to buy, borrow, or exchange across your campus.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/homepage.css">
  <link rel="stylesheet" href="../css/marketplace.css">

  <!-- Supabase Route Guard -->
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from "../src/supabaseClient.js";

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      const user = session.user;
      const current = typeof getCurrentUser === "function" ? getCurrentUser() : null;
      if (!current || current.id !== user.id) {
        if (typeof setCurrentUser === "function") {
          setCurrentUser({
            id: user.id,
            name: user.user_metadata?.full_name || user.user_metadata?.name || user.email.split("@")[0],
            email: user.email,
            avatar: user.user_metadata?.avatar_url || null,
            university: user.user_metadata?.university || "Campus Member"
          });
          if (typeof initNavbar === "function") initNavbar();
        }
      }
    }
  </script>
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL NAVBAR (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <header id="navbar" class="site-header"></header>

  <main>

    <!-- ══════════════════════════════════════════════════════════
         WISHLIST HEADER (Figma design compliant)
    ══════════════════════════════════════════════════════════ -->
    <section class="wl-page-header">
      <div class="container">
        <!-- Small Pink/Red Badge -->
        <div class="wl-badge">
          <span>❤️</span>
          <span>Saved Campus Items</span>
        </div>

        <div class="wl-header-inner">
          <div class="wl-titles">
            <h1>My Saved Wishlist</h1>
            <p>Keep track of items you want to buy, borrow, or exchange</p>
          </div>

          <!-- Right side: Notify me toggle button -->
          <button type="button" id="wl-notify-toggle-btn" class="wl-notify-btn"
            title="Toggle Notifications for Similar Items">
            <span id="wl-notify-icon">🔔</span>
            <span id="wl-notify-text">Notify me when similar items are posted</span>
          </button>
        </div>

      </div>
    </section>

    <!-- ══════════════════════════════════════════════════════════
         SAVED ITEMS CONTENT & GRID
    ══════════════════════════════════════════════════════════ -->
    <div class="container pb-3xl">

      <!-- Wishlist Toolbar -->
      <div class="wl-toolbar" id="wl-toolbar">
        <div class="wl-count-label" id="wl-count-text">
          Loading saved items...
        </div>

        <div class="wl-toolbar-actions">
          <a href="explore.html" class="btn btn-outline btn-sm">+ Browse More Items</a>
          <button type="button" id="wl-clear-all-btn" class="wl-clear-btn">
            Clear Wishlist
          </button>
        </div>
      </div>

      <!-- Responsive Saved Listings Grid -->
      <div id="wl-grid" class="mp-grid">
        <!-- Rendered dynamically by wishlist.js -->
      </div>

    </div>

  </main>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL FOOTER (injected by main.js)
  ══════════════════════════════════════════════════════════ -->
  <footer id="footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/wishlist.js"></script>
</body>

</html>
